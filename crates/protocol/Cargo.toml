[package]
name = "grandspace-protocol"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Wire messages between the Grandspace server and its thin clients"
rust-version = "1.82"

[dependencies]
grandspace-sim = { path = "../sim", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
