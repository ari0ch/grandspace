[package]
name = "grandspace-server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Authoritative Grandspace server: runs the galaxy and serves thin clients over WebSockets"
rust-version = "1.82"

[[bin]]
name = "grandspace-server"
path = "src/main.rs"

[dependencies]
grandspace-sim = { path = "../sim", version = "0.1.0" }
grandspace-protocol = { path = "../protocol", version = "0.1.0" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tokio-tungstenite = "0.26"
